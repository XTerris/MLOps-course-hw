            bug:
            - bug
            documentation:
            - documentation
            - docs
            feature:
            - enhancement
            - feature
            - feature request
            question:
            - question
          allowed_licenses:
          - MIT
          - Apache-2.0
          - BSD-2-Clause
          - BSD-3-Clause
          - ISC
          versions:
            v1:
              examples_per_class: 450
            v2:
              examples_per_class: 700
          system_prompts:
          - 'Classify the GitHub issue into exactly one category: bug, documentation,
            feature, or question. Reply with the category only.'
          - You route GitHub issues. Choose one label from bug, documentation,
            feature, question and output only that label.
          - 'Read the issue and identify its type: bug, documentation, feature, or
            question. Return just the type.'
          - 'Assign one of four categories to this GitHub issue: bug, documentation,
            feature, question. Do not explain your choice.'
          - 'Determine the intent of the GitHub issue. Answer with exactly one of:
            bug, documentation, feature, question.'
        paths.metrics_collect: metrics/collect.json
        paths.raw: data/raw.jsonl
