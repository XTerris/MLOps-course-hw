    params:
      params.yaml:
        compare:
          max_new_tokens: 16
          prompts:
          - "Title: Unclear licensing for contrib/sparsity\n\nBody:\n**Describe the
            Bug**\nThe https://github.com/NVIDIA/apex/tree/master/apex/contrib/sparsity
            folder describes itself as All Rights Reserved.\n\nIs this covered by
            the overall BSD-3-Clause license of apex, or is it proprietary NVIDIA
            and not intended for others to use?"
          - "Title: The documentation for CSS variables should clearly state the scope
            of variables\n\nBody:\nThe [documentation for CSS variables](https://textual.textualize.io/guide/CSS/#css-variables)
            doesn't appear to say what the scope of those variables is. For example,
            it would seem that if you're using `CSS_PATH`, you can't define a series
            of variables in one file earlier in the path, and then use those variables
            in files later on in the path. If this is working as intended we should
            document this."
          - "Title: pls try qwen3(think version) and deepseek-r1-0528\n\nBody:\nAs
            two excellent and inexpensive models, it would be nice to see the results
            of testing these two models, perhaps to make this project more practicable!"
          - "Title: pytorch-ada\n\nBody:\n### Description & Motivation\n\nHi,\nDo
            you officially support pytorch-ada https://pytorch-ada.readthedocs.io/en/latest/getting_started.html
            ?\nBest\n\n### Pitch\n\n_No response_\n\n### Alternatives\n\n_No response_\n\
            \n### Additional context\n\n_No response_\n\ncc @borda"
          - "Title: Not Able to install apex.\n\nBody:\nfrom pyramid.session import
            UnencryptedCookieSessionFactoryConfig\nTraceback (most recent call last):\n\
            \  File \"<stdin>\", line 1, in <module>\nImportError: cannot import name
            'UnencryptedCookieSessionFactoryConfig' from 'pyramid.session' (unknown
            location)\n\n\nplese help . need your suggestion .. Thanks in Advance
            ."
          system: 'Classify the GitHub issue into exactly one category: bug, documentation,
            feature, or question. Reply with the category only.'
          references:
          - id: github:NVIDIA/apex#1789
            expected: bug
          - id: github:Textualize/textual#3951
            expected: documentation
          - id: github:TauricResearch/TradingAgents#12
            expected: feature
          - id: github:Lightning-AI/pytorch-lightning#19612
            expected: question
          - id: github:NVIDIA/apex#1800
            expected: bug
        model:
          name: Qwen/Qwen3-0.6B
          device: auto
          dtype: bfloat16
          enable_thinking: false
          revision: c1899de289a04d12100db370d81485cdf75e47ca
        paths.compare: docs/compare.md
        paths.metrics: metrics
        paths.models: models
        train.seed: 42
    outs:
    - path: docs/compare.md
      hash: md5
      md5: e1ae00d6d41d5e0e3b2a586dcefba80d
      size: 3674
    - path: metrics/compare_all_layers.json
