# Единственная точка конфигурации ДЗ 5. В src/ нет ни имени модели,
# ни learning rate, ни путей.
model:
  name: "Qwen/Qwen3-0.6B"
  device: "auto"            # auto | cpu | cuda | mps
  # Базовые веса в bfloat16: они заморожены, точность им не нужна, а память
  # и время уходят вдвое. Сами матрицы LoRA peft держит в float32 — там идут
  # крошечные обновления AdamW. На старом CPU без bf16 ставьте float32.
  dtype: "bfloat16"
  enable_thinking: false    # как в ДЗ 4: шаблон должен совпадать с обучением

data:
  # Выход стадии tokenize из ДЗ 4. У студента — свой путь.
  train: "data/tokenized/train.pt"
  val: "data/tokenized/val.pt"

lora:
  r: 8
  alpha: 16                 # итоговый масштаб апдейта alpha / r = 2
  dropout: 0.05
  # Только проекции внимания и MLP. embed_tokens и lm_head — это 155 млн
  # параметров каждый; в modules_to_save они уезжают в адаптер целиком.
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

train:
  seed: 42
  epochs: 1
  batch_size: 2
  grad_accum: 4             # эффективный батч = 8: память как у батча 2, шаг как у батча 8
  lr: 1.0e-2
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  eval_every: 10            # шагов оптимизатора между замерами val loss
  # Логиты на весь словарь: 2 примера x 512 токенов x 151 936 x 4 байта = 0,6 ГБ.
  # Батч 8 на оценке — уже 2,5 ГБ одних логитов, и ноутбук уходит в своп.
  eval_batch_size: 2
  gradient_checkpointing: true   # без него на ноутбуке с 16–32 ГБ не влезает
  max_steps: null           # null — по эпохам; число — обрезать (smoke-тесты)

# Эксперимент по слоям: второй прогон без адаптеров на первых N слоях.
variants:
  - name: "all_layers"
    freeze_first: 0
  - name: "freeze14"
    freeze_first: 14

compare:
  max_new_tokens: 40
  # Пять фиксированных промптов: одни и те же для базовой модели и адаптера.
  prompts:
    - "Тема:\nАртериальная гипертензия у взрослых\n\nВопрос:\nЦелевой уровень систолического АД у большинства пациентов моложе 65 лет составляет\n\nВарианты ответа:\n0. 150–159 мм рт. ст.\n1. 120–130 мм рт. ст.\n2. 140–149 мм рт. ст.\n3. менее 110 мм рт. ст."
    - "Тема:\nСахарный диабет 2 типа у взрослых\n\nВопрос:\nПрепаратом первой линии при отсутствии противопоказаний является\n\nВарианты ответа:\n0. инсулин гларгин\n1. метформин\n2. глибенкламид\n3. акарбоза"
    - "Тема:\nВнебольничная пневмония у взрослых\n\nВопрос:\nОсновным методом подтверждения диагноза пневмонии является\n\nВарианты ответа:\n0. общий анализ крови\n1. рентгенография органов грудной клетки\n2. бактериоскопия мокроты\n3. спирометрия"
    - "Тема:\nЖелезодефицитная анемия\n\nВопрос:\nНаиболее информативный показатель запасов железа в организме\n\nВарианты ответа:\n0. сывороточное железо\n1. цветовой показатель\n2. ферритин сыворотки\n3. количество ретикулоцитов"
    - "Тема:\nОстрый аппендицит у взрослых\n\nВопрос:\nСимптом Щёткина–Блюмберга указывает на\n\nВарианты ответа:\n0. раздражение брюшины\n1. кишечную непроходимость\n2. почечную колику\n3. холецистит"
  system: "Ты отвечаешь на русскоязычные тестовые вопросы НМО. Дан вопрос и варианты ответа с нумерацией с 0. Выбери один правильный вариант. Ответь только номером варианта и текстом ответа, без объяснений."

paths:
  models: "models"
  metrics: "metrics"
  curves: "docs/curves.png"
  compare: "docs/compare.md"
