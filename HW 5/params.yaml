# Собственные тензоры ДЗ 4; полная эпоха без ограничения шагов.
# Microbatch 2 x 4; длина issue до 1792 токенов. LoRA r=8, alpha/r=2.
# Логиты только на ответе; validation-батчи группируются по длине.
model:
  name: Qwen/Qwen3-0.6B
  device: auto
  dtype: bfloat16
  enable_thinking: false
  revision: c1899de289a04d12100db370d81485cdf75e47ca
data:
  train: ../HW 4/data/tokenized/train.pt
  val: ../HW 4/data/tokenized/val.pt
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
train:
  seed: 42
  epochs: 1
  batch_size: 2
  grad_accum: 4
  lr: 0.0002
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  eval_every: 10
  eval_batch_size: 8
  gradient_checkpointing: true
  max_steps: null
variants:
- name: all_layers
  freeze_first: 0
- name: freeze14
  freeze_first: 14
compare:
  max_new_tokens: 16
  prompts:
  - |-
    Title: Unclear licensing for contrib/sparsity

    Body:
    **Describe the Bug**
    The https://github.com/NVIDIA/apex/tree/master/apex/contrib/sparsity folder describes itself as All Rights Reserved.

    Is this covered by the overall BSD-3-Clause license of apex, or is it proprietary NVIDIA and not intended for others to use?
  - |-
    Title: The documentation for CSS variables should clearly state the scope of variables

    Body:
    The [documentation for CSS variables](https://textual.textualize.io/guide/CSS/#css-variables) doesn't appear to say what the scope of those variables is. For example, it would seem that if you're using `CSS_PATH`, you can't define a series of variables in one file earlier in the path, and then use those variables in files later on in the path. If this is working as intended we should document this.
  - |-
    Title: pls try qwen3(think version) and deepseek-r1-0528

    Body:
    As two excellent and inexpensive models, it would be nice to see the results of testing these two models, perhaps to make this project more practicable!
  - |-
    Title: pytorch-ada

    Body:
    ### Description & Motivation

    Hi,
    Do you officially support pytorch-ada https://pytorch-ada.readthedocs.io/en/latest/getting_started.html ?
    Best

    ### Pitch

    _No response_

    ### Alternatives

    _No response_

    ### Additional context

    _No response_

    cc @borda
  - |-
    Title: Not Able to install apex.

    Body:
    from pyramid.session import UnencryptedCookieSessionFactoryConfig
    Traceback (most recent call last):
      File "<stdin>", line 1, in <module>
    ImportError: cannot import name 'UnencryptedCookieSessionFactoryConfig' from 'pyramid.session' (unknown location)


    plese help . need your suggestion .. Thanks in Advance .
  system: 'Classify the GitHub issue into exactly one category: bug, documentation, feature, or question. Reply with the category
    only.'
  references:
  - id: github:NVIDIA/apex#1789
    expected: bug
  - id: github:Textualize/textual#3951
    expected: documentation
  - id: github:TauricResearch/TradingAgents#12
    expected: feature
  - id: github:Lightning-AI/pytorch-lightning#19612
    expected: question
  - id: github:NVIDIA/apex#1800
    expected: bug
paths:
  models: models
  metrics: metrics
  curves: docs/curves.png
  compare: docs/compare.md
